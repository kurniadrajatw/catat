<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas — Catatan Pengeluaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --ink:#1B2B22;
    --paper:#F6F1E4;
    --paper-2:#EDE6D3;
    --brass:#C9A227;
    --rust:#8A3324;
    --money:#3F6B4F;
    --line: rgba(27,43,34,0.14);
    --shadow: 0 10px 30px rgba(27,43,34,0.12);
    --warn-bg:#F6E4C6;
    --warn-line:#C9A227;
    --tape-text:#F6F1E4;
    --tape-text-dim: rgba(246,241,228,0.7);
  }
  [data-theme="dark"]{
    --ink:#EFE9D8;
    --paper:#161C17;
    --paper-2:#20281F;
    --brass:#E0B840;
    --rust:#E0725A;
    --money:#6FBF8B;
    --line: rgba(239,233,216,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --warn-bg:#3A3016;
    --warn-line:#E0B840;
    --tape-text:#EFE9D8;
    --tape-text-dim: rgba(239,233,216,0.7);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(201,162,39,0.10), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 0;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:18px 4px 14px;border-bottom:2px solid var(--ink);
    margin-bottom:18px;gap:12px;
  }
  header.top .brand{display:flex;flex-direction:column;gap:2px;}
  header.top .brand .eyebrow{
    font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--rust);
  }
  header.top .brand h1{
    font-family:'Fraunces', serif;font-weight:700;font-size:28px;margin:0;
    letter-spacing:-0.01em;
  }
  header.top .right{display:flex;align-items:flex-end;gap:12px;}
  header.top .clock{
    font-family:'IBM Plex Mono', monospace;font-size:12.5px;text-align:right;
    color:var(--ink);opacity:.75;line-height:1.5;
  }
  header.top .clock .time{font-size:18px;font-weight:600;color:var(--rust);}
  .theme-toggle{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper-2);cursor:pointer;font-size:17px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }

  .total-tape{
    background:var(--ink);color:var(--tape-text);
    border-radius:14px;padding:20px 22px;
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:var(--shadow);margin-bottom:14px;
    position:relative;overflow:hidden;flex-wrap:wrap;gap:14px;
  }
  [data-theme="dark"] .total-tape{background:#0D110E;}
  .total-tape::before{
    content:"";position:absolute;inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(246,241,228,0.05) 0 1px, transparent 1px 22px);
    pointer-events:none;
  }
  .total-tape .label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tape-text-dim);}
  .total-tape .amount{font-family:'Fraunces',serif;font-size:34px;font-weight:600;margin-top:4px;color:var(--tape-text);}
  .total-tape .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--tape-text-dim);margin-top:6px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;
    background:rgba(246,241,228,0.08);color:var(--tape-text);border:1px solid rgba(246,241,228,0.25);
    padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  .tab-btn.active{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;}

  .budget-warning{
    display:flex;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-line);
    border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13.5px;font-weight:500;
  }
  .budget-warning .ic{font-size:18px;}

  section{display:none;}
  section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .entry-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:16px;
    padding:20px;box-shadow:var(--shadow);
  }
  .amount-display{
    font-family:'IBM Plex Mono',monospace;font-weight:700;
    font-size:42px;text-align:right;letter-spacing:0.5px;
    padding:10px 6px;border-bottom:2px dashed var(--ink);margin-bottom:16px;
    color:var(--rust);word-break:break-all;
  }
  .amount-display .cur{font-size:20px;opacity:.55;margin-right:6px;color:var(--ink);}
  .keypad{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;
  }
  .keypad button{
    font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;
    padding:16px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);cursor:pointer;
    transition:.1s;
  }
  .keypad button:active{transform:scale(0.96);background:var(--brass);}
  .keypad button.op{color:var(--rust);}

  .field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field-row label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:.12em;opacity:.6;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:500;
    padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;
    color:var(--ink);
  }
  .chip.selected{background:var(--money);color:var(--paper);border-color:var(--money);}
  select, input[type=text], input[type=date], input[type=time], input[type=search]{
    width:100%;font-family:'Space Grotesk',sans-serif;font-size:14.5px;
    padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);
  }
  .datetime-row{display:flex;gap:10px;}
  .datetime-row > div{flex:1;}

  .submit-btn{
    width:100%;padding:15px 0;border:none;border-radius:12px;
    background:var(--rust);color:var(--paper);font-family:'Fraunces',serif;
    font-weight:600;font-size:17px;cursor:pointer;letter-spacing:.01em;
    transition:.15s;box-shadow:var(--shadow);
  }
  .submit-btn:active{transform:translateY(1px);}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar input[type=search]{flex:2;min-width:160px;}
  .toolbar select{flex:1;min-width:140px;}
  .export-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .export-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;
    padding:10px 16px;border-radius:9px;border:1px solid var(--line);
    background:var(--paper-2);color:var(--ink);cursor:pointer;transition:.15s;
    display:flex;align-items:center;gap:6px;
  }
  .export-btn:hover{background:var(--money);color:var(--paper);border-color:var(--money);}

  .day-group{margin-bottom:22px;}
  .day-heading{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--rust);display:flex;justify-content:space-between;
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;
  }
  .entry-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px dotted var(--line);gap:10px;
  }
  .entry-row .left{display:flex;align-items:center;gap:12px;min-width:0;}
  .cat-dot{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;
  }
  .entry-row .meta{min-width:0;}
  .entry-row .cat-name{font-weight:600;font-size:14.5px;}
  .entry-row .time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.55;}
  .entry-row .note{font-size:12px;opacity:.6;font-style:italic;}
  .entry-row .amount{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15.5px;color:var(--rust);white-space:nowrap;
  }
  .del-btn{
    background:none;border:none;color:var(--ink);opacity:.3;cursor:pointer;font-size:16px;padding:4px 6px;
  }
  .del-btn:hover{opacity:.8;color:var(--rust);}
  .empty-state{
    text-align:center;padding:50px 20px;opacity:.55;font-family:'IBM Plex Mono',monospace;font-size:13px;
  }

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
  .stat-box{
    background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px;
  }
  .stat-box .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.6;}
  .stat-box .val{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin-top:4px;color:var(--money);}
  .chart-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;
  }
  .chart-card h3{
    font-family:'Fraunces',serif;font-size:16px;margin:0 0 12px;font-weight:600;
  }
  .cat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .cat-bar-row .name{width:110px;flex-shrink:0;font-weight:500;}
  .cat-bar-row .track{flex:1;height:9px;background:var(--paper);border-radius:5px;overflow:hidden;}
  .cat-bar-row .fill{height:100%;border-radius:5px;}
  .cat-bar-row .pct{font-family:'IBM Plex Mono',monospace;width:70px;text-align:right;flex-shrink:0;font-size:12px;opacity:.75;}

  .insight-row{
    display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;margin-bottom:10px;
    background:var(--paper);border:1px solid var(--line);font-size:13px;line-height:1.5;
  }
  .insight-row.alert{background:var(--warn-bg);border-color:var(--warn-line);}
  .insight-row .ic{font-size:17px;flex-shrink:0;}
  .insight-row b{display:block;margin-bottom:2px;}

  @media (max-width:600px){
    header.top{flex-direction:column;align-items:flex-start;gap:10px;}
    header.top .right{width:100%;justify-content:space-between;}
    header.top .clock{text-align:left;}
    .total-tape{flex-direction:column;align-items:flex-start;gap:14px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .amount-display{font-size:34px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="eyebrow">Buku Kas Pribadi</span>
      <h1>Pengeluaran</h1>
    </div>
    <div class="right">
      <div class="clock">
        <div id="clockDate">—</div>
        <div class="time" id="clockTime">--:--:--</div>
        <div id="syncStatus" style="font-size:10.5px;margin-top:2px;opacity:.7;">●&nbsp;menghubungkan…</div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Ganti tema">🌙</button>
    </div>
  </header>

  <div class="total-tape">
    <div>
      <div class="label" id="totalLabel">Periode Berjalan</div>
      <div class="amount" id="totalAmount">Rp 0</div>
      <div class="sub" id="totalSub">0 transaksi</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="catat">Catat</button>
      <button class="tab-btn" data-tab="riwayat">Riwayat</button>
      <button class="tab-btn" data-tab="analitik">Analitik</button>
    </div>
  </div>

  <div class="budget-warning" id="budgetWarning" style="display:none;">
    <span class="ic">⚠️</span>
    <span id="budgetWarningText"></span>
  </div>

  <section id="tab-catat" class="active">
    <div class="entry-card">
      <div class="amount-display"><span class="cur">Rp</span><span id="amountText">0</span></div>

      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="000">000</button><button data-k="0">0</button>
        <button data-k="back" class="op">⌫</button>
      </div>

      <div class="field-row">
        <label>Kategori</label>
        <div class="chip-row" id="catChips"></div>
      </div>

      <div class="field-row">
        <label>Dibayar Dengan</label>
        <div class="chip-row" id="payChips"></div>
      </div>

      <div class="field-row">
        <label>Catatan (opsional)</label>
        <input type="text" id="noteInput" placeholder="mis. makan siang tim">
      </div>

      <div class="field-row">
        <label>Waktu</label>
        <div class="datetime-row">
          <div><input type="date" id="dateInput"></div>
          <div><input type="time" id="timeInput" step="1"></div>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" disabled>Simpan Pengeluaran</button>
    </div>
  </section>

  <section id="tab-riwayat">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Cari catatan atau kategori...">
      <select id="sortSelect">
        <option value="terbaru">Terbaru</option>
        <option value="terlama">Terlama</option>
        <option value="terbesar">Nominal Terbesar</option>
        <option value="terkecil">Nominal Terkecil</option>
      </select>
    </div>
    <div class="export-row">
      <button class="export-btn" id="exportExcel">📊 Export Excel</button>
      <button class="export-btn" id="exportPdf">📄 Export PDF</button>
    </div>
    <div id="historyList"></div>
  </section>

  <section id="tab-analitik">
    <div class="stat-grid">
      <div class="stat-box"><div class="lbl">Hari Ini</div><div class="val" id="statToday">Rp 0</div></div>
      <div class="stat-box"><div class="lbl">Minggu Ini</div><div class="val" id="statWeek">Rp 0</div></div>
      <div class="stat-box"><div class="lbl">Periode Ini</div><div class="val" id="statMonth">Rp 0</div></div>
    </div>

    <div class="chart-card">
      <h3>Komposisi per Kategori (Periode Ini)</h3>
      <canvas id="pieChart" height="220"></canvas>
      <div id="catBars" style="margin-top:16px;"></div>
    </div>

    <div class="chart-card">
      <h3>Tren 14 Hari Terakhir</h3>
      <canvas id="lineChart" height="180"></canvas>
    </div>

    <div class="chart-card">
      <h3>🔮 Prediksi &amp; Pengingat Anggaran</h3>
      <div id="insightsList"></div>
    </div>
  </section>

</div>

<script>
const CATEGORIES = [
  {id:'makan', label:'Makan', emoji:'🍜', color:'#8A3324'},
  {id:'transport', label:'Transport', emoji:'🛵', color:'#C9A227'},
  {id:'belanja', label:'Belanja', emoji:'🛍️', color:'#3F6B4F'},
  {id:'tagihan', label:'Tagihan', emoji:'🧾', color:'#5C6B73'},
  {id:'hiburan', label:'Hiburan', emoji:'🎬', color:'#A15C38'},
  {id:'kesehatan', label:'Kesehatan', emoji:'💊', color:'#4C7A8C'},
  {id:'lainnya', label:'Lainnya', emoji:'✳️', color:'#8C7A4C'},
];
const PAYMENTS = [
  {id:'tunai', label:'Tunai', emoji:'💵'},
  {id:'transfer', label:'Transfer', emoji:'🏦'},
  {id:'qris', label:'Qris', emoji:'🔳'},
  {id:'ewallet', label:'E-Wallet', emoji:'📱'},
];
const CATEGORY_BUDGET_LIMIT = 1000000;
const TOTAL_BUDGET_LIMIT = 1000000;

const CATEGORY_TIPS = {
  makan: 'Coba masak/bawa bekal beberapa kali seminggu, dan batasi jajan/kopi kekinian.',
  transport: 'Pertimbangkan transportasi umum atau gabung perjalanan (carpool) untuk rute rutin.',
  belanja: 'Terapkan aturan tunggu 24 jam sebelum beli barang non-kebutuhan agar tidak impulsif.',
  tagihan: 'Cek ulang langganan yang jarang dipakai (streaming, aplikasi) dan berhenti jika perlu.',
  hiburan: 'Tetapkan pagu bulanan khusus hiburan supaya tidak menggerus dana penting lain.',
  kesehatan: 'Prioritaskan pencegahan (olahraga, tidur cukup) untuk menekan biaya berobat jangka panjang.',
  lainnya: 'Coba kelompokkan ulang pengeluaran "lainnya" agar lebih jelas kemana perginya uang.',
};

let entries = [];
let currentAmount = '';
let selectedCat = null;
let selectedPay = null;

const $ = (id) => document.getElementById(id);

function fmtRupiah(n){
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

function getPeriodRange(refDate = new Date()){
  const d = refDate;
  let start;
  if(d.getDate() >= 25){
    start = new Date(d.getFullYear(), d.getMonth(), 25, 0,0,0,0);
  } else {
    start = new Date(d.getFullYear(), d.getMonth()-1, 25, 0,0,0,0);
  }
  const end = new Date(start.getFullYear(), start.getMonth()+1, 24, 23,59,59,999);
  return { start, end };
}
function periodLabel(start, end){
  const optS = {day:'numeric', month:'short'};
  const optE = {day:'numeric', month:'short', year:'numeric'};
  return `${start.toLocaleDateString('id-ID',optS)} – ${end.toLocaleDateString('id-ID',optE)}`;
}
function entriesInPeriod(list, start, end){
  return list.filter(e=>{
    const d = new Date(e.datetime);
    return d >= start && d <= end;
  });
}

function updateClock(){
  const now = new Date();
  const dateFmt = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const timeFmt = now.toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('clockDate').textContent = dateFmt;
  $('clockTime').textContent = timeFmt;
}
updateClock();
setInterval(updateClock, 1000);

function setDefaultDateTime(){
  const now = new Date();
  const pad = (x)=>String(x).padStart(2,'0');
  $('dateInput').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  $('timeInput').value = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
setDefaultDateTime();

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  $('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('theme', theme); }catch(e){}
}
function initTheme(){
  let theme = 'light';
  try{
    theme = localStorage.getItem('theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }catch(e){}
  applyTheme(theme);
}
$('themeToggle').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  if($('tab-analitik').classList.contains('active')) renderCharts();
});
initTheme();

function buildChips(){
  const catWrap = $('catChips');
  catWrap.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = `<span>${c.emoji}</span><span>${c.label}</span>`;
    el.onclick = ()=>{ selectedCat = c.id; refreshChips(); validateForm(); };
    el.dataset.id = c.id;
    catWrap.appendChild(el);
  });
  const payWrap = $('payChips');
  payWrap.innerHTML = '';
  PAYMENTS.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = `<span>${p.emoji}</span><span>${p.label}</span>`;
    el.onclick = ()=>{ selectedPay = p.id; refreshChips(); };
    el.dataset.id = p.id;
    payWrap.appendChild(el);
  });
}
function refreshChips(){
  document.querySelectorAll('#catChips .chip').forEach(el=>{
    el.classList.toggle('selected', el.dataset.id === selectedCat);
  });
  document.querySelectorAll('#payChips .chip').forEach(el=>{
    el.classList.toggle('selected', el.dataset.id === selectedPay);
  });
}
buildChips();
selectedPay = 'tunai';
refreshChips();

$('keypad').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const k = btn.dataset.k;
  if(k === 'back'){
    currentAmount = currentAmount.slice(0,-1);
  } else {
    if(currentAmount === '0') currentAmount = '';
    if((currentAmount + k).length <= 12) currentAmount += k;
  }
  $('amountText').textContent = currentAmount === '' ? '0' : Number(currentAmount).toLocaleString('id-ID');
  validateForm();
});

function validateForm(){
  const ok = Number(currentAmount) > 0 && selectedCat;
  $('submitBtn').disabled = !ok;
}

$('submitBtn').addEventListener('click', ()=>{
  const amount = Number(currentAmount);
  if(!amount || !selectedCat) return;
  const dateVal = $('dateInput').value;
  const timeVal = $('timeInput').value || '00:00:00';
  const iso = `${dateVal}T${timeVal}`;
  const entry = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    amount, category: selectedCat, payment: selectedPay,
    note: $('noteInput').value.trim(), datetime: iso,
  };
  saveEntries(entry);
  entries.unshift(entry);
  renderAll();

  currentAmount = '';
  $('amountText').textContent = '0';
  $('noteInput').value = '';
  selectedCat = null;
  refreshChips();
  setDefaultDateTime();
  validateForm();

  switchTab('riwayat');
});

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  $('tab-'+name).classList.add('active');
  if(name==='analitik') renderCharts();
  if(name==='riwayat') renderHistory();
}
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=> switchTab(b.dataset.tab));
});

function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }
function payInfo(id){ return PAYMENTS.find(p=>p.id===id) || PAYMENTS[0]; }

function getFilteredSortedEntries(){
  const q = ($('searchInput').value || '').trim().toLowerCase();
  const sortBy = $('sortSelect').value;
  let list = [...entries];
  if(q){
    list = list.filter(e=>{
      const c = catInfo(e.category);
      const p = payInfo(e.payment);
      return (e.note||'').toLowerCase().includes(q)
        || c.label.toLowerCase().includes(q)
        || p.label.toLowerCase().includes(q)
        || String(e.amount).includes(q);
    });
  }
  switch(sortBy){
    case 'terlama': list.sort((a,b)=> new Date(a.datetime) - new Date(b.datetime)); break;
    case 'terbesar': list.sort((a,b)=> b.amount - a.amount); break;
    case 'terkecil': list.sort((a,b)=> a.amount - b.amount); break;
    default: list.sort((a,b)=> new Date(b.datetime) - new Date(a.datetime));
  }
  return list;
}

function renderHistory(){
  const list = $('historyList');
  const filtered = getFilteredSortedEntries();
  if(entries.length === 0){
    list.innerHTML = `<div class="empty-state">Belum ada catatan.<br>Yuk catat pengeluaran pertamamu di tab "Catat".</div>`;
    return;
  }
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state">Tidak ada hasil untuk pencarian ini.</div>`;
    return;
  }
  const sortBy = $('sortSelect').value;
  const groupByDay = (sortBy === 'terbaru' || sortBy === 'terlama');

  if(!groupByDay){
    let html = '';
    filtered.forEach(e=>{ html += entryRowHtml(e); });
    list.innerHTML = html;
  } else {
    const groups = {};
    filtered.forEach(e=>{
      const d = new Date(e.datetime);
      const key = d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
      (groups[key] = groups[key] || []).push(e);
    });
    let html = '';
    for(const [day, list_] of Object.entries(groups)){
      const daySum = list_.reduce((s,e)=>s+e.amount,0);
      html += `<div class="day-group"><div class="day-heading"><span>${day}</span><span>${fmtRupiah(daySum)}</span></div>`;
      list_.forEach(e=>{ html += entryRowHtml(e); });
      html += `</div>`;
    }
    list.innerHTML = html;
  }

  list.querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      entries = entries.filter(e=>e.id !== b.dataset.id);
      renderAll();
      deleteEntryRemote(b.dataset.id);
    });
  });
}

function entryRowHtml(e){
  const c = catInfo(e.category);
  const p = payInfo(e.payment);
  const t = new Date(e.datetime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  const dLabel = new Date(e.datetime).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  return `<div class="entry-row">
    <div class="left">
      <div class="cat-dot" style="background:${c.color}22;">${c.emoji}</div>
      <div class="meta">
        <div class="cat-name">${c.label} <span style="opacity:.5;font-weight:400;">· ${p.emoji}</span></div>
        <div class="time">${dLabel}, ${t}${e.note ? ' · ' : ''}</div>
        ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="amount">${fmtRupiah(e.amount)}</div>
      <button class="del-btn" data-id="${e.id}" title="Hapus">✕</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

$('searchInput').addEventListener('input', renderHistory);
$('sortSelect').addEventListener('change', renderHistory);

function isSameDay(a,b){ return a.toDateString()===b.toDateString(); }
function startOfWeek(d){
  const x = new Date(d); const day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x;
}
function renderTotals(){
  const now = new Date();
  const { start, end } = getPeriodRange(now);
  const periodEntries = entriesInPeriod(entries, start, end);
  const periodSum = periodEntries.reduce((s,e)=>s+e.amount,0);

  $('totalLabel').textContent = `Periode ${periodLabel(start,end)}`;
  $('totalAmount').textContent = fmtRupiah(periodSum);
  $('totalSub').textContent = `${periodEntries.length} transaksi`;

  const todaySum = entries.filter(e=> isSameDay(new Date(e.datetime), now)).reduce((s,e)=>s+e.amount,0);
  const wkStart = startOfWeek(now);
  const weekSum = entries.filter(e=> new Date(e.datetime) >= wkStart).reduce((s,e)=>s+e.amount,0);

  $('statToday').textContent = fmtRupiah(todaySum);
  $('statWeek').textContent = fmtRupiah(weekSum);
  $('statMonth').textContent = fmtRupiah(periodSum);

  const warnEl = $('budgetWarning');
  if(periodSum > TOTAL_BUDGET_LIMIT){
    warnEl.style.display = 'flex';
    $('budgetWarningText').textContent =
      `Pengeluaran periode ini sudah ${fmtRupiah(periodSum)}, melewati batas ${fmtRupiah(TOTAL_BUDGET_LIMIT)}. Coba rem pengeluaran sampai periode baru mulai (tanggal 25).`;
  } else {
    warnEl.style.display = 'none';
  }
}

let pieChartInstance = null;
let lineChartInstance = null;

function chartTextColor(){
  return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1B2B22';
}

function renderCharts(){
  const now = new Date();
  const { start, end } = getPeriodRange(now);
  const periodEntries = entriesInPeriod(entries, start, end);

  const byCat = {};
  periodEntries.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const total = Object.values(byCat).reduce((a,b)=>a+b,0) || 1;
  const catIds = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);

  const pieCtx = $('pieChart').getContext('2d');
  if(pieChartInstance) pieChartInstance.destroy();
  if(catIds.length === 0){
    pieCtx.clearRect(0,0,pieCtx.canvas.width, pieCtx.canvas.height);
  } else {
    pieChartInstance = new Chart(pieCtx, {
      type:'doughnut',
      data:{
        labels: catIds.map(id=>catInfo(id).label),
        datasets:[{ data: catIds.map(id=>byCat[id]), backgroundColor: catIds.map(id=>catInfo(id).color), borderColor: getComputedStyle(document.documentElement).getPropertyValue('--paper').trim(), borderWidth:2 }]
      },
      options:{
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:"'Space Grotesk', sans-serif", size:12}, color: chartTextColor() } } },
        cutout:'62%'
      }
    });
  }

  const barsWrap = $('catBars');
  barsWrap.innerHTML = catIds.map(id=>{
    const c = catInfo(id);
    const pct = (byCat[id]/total*100).toFixed(1);
    return `<div class="cat-bar-row">
      <div class="name">${c.emoji} ${c.label}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${c.color};"></div></div>
      <div class="pct">${pct}%</div>
    </div>`;
  }).join('') || `<div class="empty-state">Belum ada data periode ini.</div>`;

  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    days.push(d);
  }
  const dayLabels = days.map(d=> d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}));
  const daySums = days.map(d=> entries.filter(e=>isSameDay(new Date(e.datetime), d)).reduce((s,e)=>s+e.amount,0));

  const lineCtx = $('lineChart').getContext('2d');
  if(lineChartInstance) lineChartInstance.destroy();
  const tc = chartTextColor();
  lineChartInstance = new Chart(lineCtx, {
    type:'bar',
    data:{
      labels: dayLabels,
      datasets:[{ data: daySums, backgroundColor:'#3F6B4F', borderRadius:5, maxBarThickness:22 }]
    },
    options:{
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ ticks:{ callback:(v)=> 'Rp'+ (v>=1000? (v/1000)+'rb': v), font:{family:"'IBM Plex Mono', monospace", size:10}, color: tc }, grid:{ color:'rgba(128,128,128,0.15)' } },
        x:{ ticks:{ font:{family:"'IBM Plex Mono', monospace", size:10}, color: tc }, grid:{ display:false } }
      }
    }
  });

  renderInsights(periodEntries, byCat, start, end);
}

function renderInsights(periodEntries, byCat, start, end){
  const wrap = $('insightsList');
  const now = new Date();
  let html = '';

  const periodSum = Object.values(byCat).reduce((a,b)=>a+b,0);

  const msPerDay = 86400000;
  const daysElapsed = Math.max(1, Math.floor((Math.min(now, end) - start)/msPerDay) + 1);
  const daysTotal = Math.floor((end - start)/msPerDay) + 1;
  const avgPerDay = periodSum / daysElapsed;
  const projected = avgPerDay * daysTotal;

  html += `<div class="insight-row ${projected > TOTAL_BUDGET_LIMIT ? 'alert' : ''}">
    <span class="ic">🔮</span>
    <div>
      <b>Prediksi akhir periode: ${fmtRupiah(projected)}</b>
      Berdasarkan rata-rata pengeluaran ${fmtRupiah(avgPerDay)}/hari selama ${daysElapsed} hari berjalan (periode berlangsung ${daysTotal} hari).
      ${projected > TOTAL_BUDGET_LIMIT ? ' Kalau ritme ini berlanjut, kamu diperkirakan melewati batas wajar bulanan.' : ' Masih dalam ritme yang wajar, pertahankan ya.'}
    </div>
  </div>`;

  const catIdsSorted = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  if(catIdsSorted.length === 0){
    html += `<div class="insight-row"><span class="ic">ℹ️</span><div>Belum ada transaksi di periode ini untuk dianalisis.</div></div>`;
  }
  catIdsSorted.forEach(id=>{
    const c = catInfo(id);
    const sum = byCat[id];
    if(sum > CATEGORY_BUDGET_LIMIT){
      html += `<div class="insight-row alert">
        <span class="ic">${c.emoji}</span>
        <div>
          <b>${c.label} sudah ${fmtRupiah(sum)}, melewati Rp1.000.000</b>
          ${CATEGORY_TIPS[id] || ''}
        </div>
      </div>`;
    }
  });

  html += `<div class="insight-row">
    <span class="ic">💡</span>
    <div>
      <b>Aturan alokasi 50/30/20</b>
      Coba arahkan sekitar 50% pemasukan untuk kebutuhan pokok, 30% untuk keinginan/hiburan, dan 20% untuk tabungan/dana darurat sebagai patokan sehat.
    </div>
  </div>`;

  wrap.innerHTML = html;
}

function renderAll(){
  renderHistory();
  renderTotals();
  if($('tab-analitik').classList.contains('active')) renderCharts();
}

function getExportRows(){
  return getFilteredSortedEntries().map(e=>{
    const c = catInfo(e.category);
    const p = payInfo(e.payment);
    const d = new Date(e.datetime);
    return {
      Tanggal: d.toLocaleDateString('id-ID'),
      Jam: d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
      Kategori: c.label,
      'Dibayar Dengan': p.label,
      Catatan: e.note || '',
      Jumlah: e.amount,
    };
  });
}

$('exportExcel').addEventListener('click', ()=>{
  const rows = getExportRows();
  if(rows.length === 0){ alert('Tidak ada data untuk diexport.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:8},{wch:12},{wch:16},{wch:30},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pengeluaran');
  const fname = `pengeluaran-${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
});

$('exportPdf').addEventListener('click', ()=>{
  const rows = getExportRows();
  if(rows.length === 0){ alert('Tidak ada data untuk diexport.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text('Catatan Pengeluaran', 14, 16);
  doc.setFontSize(9);
  doc.text(`Diekspor: ${new Date().toLocaleString('id-ID')}`, 14, 22);
  doc.autoTable({
    startY: 28,
    head: [['Tanggal','Jam','Kategori','Bayar','Catatan','Jumlah']],
    body: rows.map(r=>[r.Tanggal, r.Jam, r.Kategori, r['Dibayar Dengan'], r.Catatan, 'Rp ' + r.Jumlah.toLocaleString('id-ID')]),
    styles:{ fontSize:8 },
    headStyles:{ fillColor:[27,43,34] },
  });
  const total = rows.reduce((s,r)=>s+r.Jumlah,0);
  const finalY = doc.lastAutoTable.finalY || 28;
  doc.setFontSize(10);
  doc.text(`Total: Rp ${total.toLocaleString('id-ID')}`, 14, finalY + 10);
  doc.save(`pengeluaran-${new Date().toISOString().slice(0,10)}.pdf`);
});

let sb = null;
const TABLE = 'expenses';

function setSyncStatus(state){
  const el = $('syncStatus');
  if(!el) return;
  const map = {
    ok:      ['#3F6B4F', 'tersimpan cloud'],
    saving:  ['#C9A227', 'menyimpan…'],
    error:   ['#8A3324', 'gagal sinkron, cek config.js'],
    offline: ['#8A3324', 'config.js belum diisi'],
  };
  const [color, text] = map[state] || map.error;
  el.innerHTML = `<span style="color:${color};">●</span>&nbsp;${text}`;
}

function initSupabase(){
  if(typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined'
     || !SUPABASE_URL || SUPABASE_URL.includes('ISI-')) {
    setSyncStatus('offline');
    return false;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}

function rowToEntry(r){
  return { id: r.id, amount: Number(r.amount), category: r.category, payment: r.payment, note: r.note || '', datetime: r.datetime };
}
function entryToRow(e){
  return { id: e.id, amount: e.amount, category: e.category, payment: e.payment, note: e.note, datetime: e.datetime };
}

async function saveEntries(newEntry){
  if(!sb){ setSyncStatus('offline'); return; }
  setSyncStatus('saving');
  const { error } = await sb.from(TABLE).insert(entryToRow(newEntry));
  if(error){ console.error(error); setSyncStatus('error'); }
  else { setSyncStatus('ok'); }
}

async function deleteEntryRemote(id){
  if(!sb){ setSyncStatus('offline'); return; }
  setSyncStatus('saving');
  const { error } = await sb.from(TABLE).delete().eq('id', id);
  if(error){ console.error(error); setSyncStatus('error'); }
  else { setSyncStatus('ok'); }
}

let realtimeBound = false;
async function loadEntries(){
  if(!initSupabase()){ entries = []; renderAll(); return; }
  setSyncStatus('saving');
  const { data, error } = await sb.from(TABLE).select('*').order('datetime', { ascending:false });
  if(error){ console.error(error); setSyncStatus('error'); entries = []; }
  else { entries = data.map(rowToEntry); setSyncStatus('ok'); }
  renderAll();

  if(!realtimeBound){
    realtimeBound = true;
    sb.channel('expenses-changes')
      .on('postgres_changes', { event:'*', schema:'public', table:TABLE }, () => loadEntries())
      .subscribe();
  }
}

loadEntries();
</script>
